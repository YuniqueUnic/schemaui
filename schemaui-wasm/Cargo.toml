[package]
name = "schemaui-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for the schemaui core pipeline"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuniqueunic/schemaui"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The full distributable on by default: the wasm package is the artifact
# (npm, Playground) people serve to browsers, and a silently missing
# capability degrades into source-code fallbacks on the page. Same reason
# formats are all on: mermaid used to be opt-in here, the Playground build
# never turned it on, and every diagram on GitHub Pages fell back to its
# raw source.
default = ["all_formats", "mermaid"]
all_formats = ["json", "yaml", "toml"]
json = ["schemaui/json"]
yaml = ["schemaui/yaml"]
toml = ["schemaui/toml"]
# Kept as an explicit switch so a size-conscious downstream can opt out via
# default-features = false.
mermaid = ["schemaui/mermaid"]

[dependencies]
schemaui = { path = "..", version = "0.16", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }
js-sys = "0.3"
console_error_panic_hook = { version = "0.1" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# getrandom 0.3 needs the wasm_js backend for wasm32-unknown-unknown.
# jsonschema 0.56 pulls getrandom transitively; setting this here is the
# correct place because it is the wasm crate that needs the JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
