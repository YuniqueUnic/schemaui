[package]
name = "schemaui-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for the schemaui core pipeline"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuniqueunic/schemaui"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# json is always on for wasm; yaml and toml are opt-in
default = ["json"]
json = ["schemaui/json"]
yaml = ["schemaui/yaml"]
toml = ["schemaui/toml"]

[dependencies]
schemaui = { path = "..", default-features = false, features = ["json", "wasm"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# getrandom 0.3 needs the wasm_js backend for wasm32-unknown-unknown.
# jsonschema 0.56 pulls getrandom transitively; setting this here is the
# correct place because it is the wasm crate that needs the JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
