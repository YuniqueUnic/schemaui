  <path d="M38 168 L45 175 L59 160" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="166" font-family="sans-serif" font-size="14" fill="#f8fafc">Shapes + colour</text>
  <text x="80" y="186" font-family="sans-serif" font-size="12" fill="#cbd5e1">No external images</text>
