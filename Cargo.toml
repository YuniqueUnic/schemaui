[workspace]
members = ["schemaui-cli", "schemaui-wasm"]

[package]
name = "schemaui"
authors = ["unic <yuniqueunic@gmail.com>"]
version = "0.16.3"
edition = "2024"
build = "src/build.rs"
keywords = ["tui", "schema", "configuration", "terminal", "cross-platform"]
categories = ["command-line-interface", "config"]
repository = "https://github.com/yuniqueunic/schemaui"
documentation = "https://docs.rs/schemaui"
description = "A Rust library for generating TUI and Web UIs from JSON Schemas for configuration management."
license = "MIT OR Apache-2.0"
readme = "README.md"
# A whitelist, so there is no `exclude` to pair with it: cargo warns that the
# two cannot coexist and silently drops `exclude` anyway. Every pattern is
# anchored with a leading `/` because an unanchored `README.md` or `LICENSE*`
# matches at any depth, which pulls in the README/LICENSE files that
# node_modules is full of — 2445 stray files, 85% of the unpacked tarball.
include = [
  "/Cargo.toml",
  "/keymap/default.keymap.json",
  "/src/**",
  "/web/dist/**",
  "/README.md",
  "/README.ZH.md",
  "/LICENSE*",
]

[features]
default = ["tui", "json"]
full = ["all_formats", "tui-images", "web", "wasm", "mermaid"]
tui = ["dep:crossterm", "dep:ratatui", "dep:unicode-width"]
# Native SVG rasterisation and pixel graphics protocols. Source viewing
# remains available with the lightweight `tui` feature alone.
tui-images = ["tui", "rich", "dep:ratatui-image", "dep:image", "dep:resvg"]
web = ["dep:include_dir", "dep:axum", "dep:tokio"]
web-types = ["dep:ts-rs"]
# Exposes `wasm_core`, the pure orchestration layer the `schemaui-wasm` crate
# binds to JS. No new dependencies: it is a visibility marker, the same role
# `web-types` plays for ts-rs derives.
wasm = []

all_formats = ["json", "yaml", "toml"]
json = []
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]

# Sanitised rich content for schema-authored figures and prose (raw SVG,
# markdown). Diagram rendering builds on it.
rich = ["dep:quick-xml", "dep:pulldown-cmark", "dep:ammonia"]
# Mermaid diagram rendering, delivered as pre-rendered SVG assets. Opt-in:
# the renderer is by far the heaviest dependency in the tree.
mermaid = ["rich", "dep:mermaid-rs-renderer"]

precompile = []

# use debug features for debugging which is more flexible than debug_assertions
debug = []


[dependencies]
anyhow = "1"
# The poll-based reader supports /dev/tty when stdin carries config data;
# macOS kqueue cannot register that controlling-terminal device.
crossterm = { version = "0", features = ["use-dev-tty"], optional = true }
jsonschema = { version = "0.56", default-features = false }
indexmap = { version = "2", default-features = false, features = ["serde", "std"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
serde = { version = "1", default-features = false, features = ["derive"] }
percent-encoding = { version = "2", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
unicode-width = { version = "0.2", optional = true }
regex = "1"
include_dir = { version = "0.7", optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio", "original-uri"], optional = true }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "sync",
], optional = true }
ts-rs = { version = "12", optional = true, features = ["serde-compat"] }

# For serialization formats
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "1", optional = true }

# For rich content (feature `rich` / `mermaid`)
quick-xml = { version = "0.42", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
ammonia = { version = "4", optional = true }
# Library use only: the default features pull in the CLI (clap) and PNG
# rasterisation (resvg), neither of which belongs in an embedded session.
mermaid-rs-renderer = { version = "0.3", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
# resvg 0.50 loses nested layers when rendering a cropped, zoomed viewport.
# Upstream #1238 fixes layer-local bounds; #1239 bounds layers to visible pixels.
# Return to a registry release containing both fixes after pixel verification.
# Until then, tui-images cannot be published to crates.io with this git dependency.
resvg = { git = "https://github.com/linebender/resvg", rev = "9e24e7b3ffa576ca07ed9be6a5ed16b6ecc69a7c", default-features = false, features = ["text", "system-fonts", "memmap-fonts"], optional = true }

[[example]]
name = "demo"
path = "examples/demo.rs"
required-features = ["tui"]

[[example]]
name = "tui_artifact_codegen"
path = "examples/tui_artifact_codegen.rs"
required-features = ["tui", "precompile"]

[[example]]
name = "tui_artifact_demo"
path = "examples/tui_artifact_demo.rs"
required-features = ["tui", "precompile"]

[[example]]
name = "ui_layout_dump"
path = "examples/ui_layout_dump.rs"

[[example]]
name = "web_snapshot_codegen"
path = "examples/web_snapshot_codegen.rs"
required-features = ["web", "precompile"]

[dev-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# mermaid-rs-renderer 0.3.1 times its layout stages with `std::time::Instant`,
# which the wasm32-unknown-unknown standard library does not implement — every
# render in the Playground's wasm build panicked with "time not implemented on
# this platform" and the session died before it started. The submodule at
# vendor/mermaid-rs-renderer (fork YuniqueUnic/mermaid-rs-renderer, branch
# `wasm32-time-fix`, based on upstream v0.3.1) swaps the type for `web-time` —
# a no-op on native, where it re-exports std's Instant. Bump the submodule when
# upgrading mmdr and drop the patch once upstream ships a wasm-safe timer.
[patch.crates-io]
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
