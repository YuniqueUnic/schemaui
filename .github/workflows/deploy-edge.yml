name: Deploy Edge API

# The stateless Cloudflare Worker over the schemaui-wasm exports
# (docs/en/decisions/0005-wasm-core-and-hosting.md, §7). Requires the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets — until
# those are set this workflow's deploy step fails, which is the intended
# behaviour (no silent no-op deploy).

on:
  push:
    branches: [main]
    paths:
      - "schemaui-wasm/**"
      - "src/**"
      - "edge/**"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository_owner == 'YuniqueUnic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the wasm package
        working-directory: schemaui-wasm
        run: |
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' \
            wasm-pack build --target web --out-dir pkg --scope schemaui

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: edge/pnpm-lock.yaml

      - name: Install edge worker dependencies
        working-directory: edge
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: edge
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
