[package]
name = "schemaui-cli"
version = "0.7.1"
edition = "2024"
authors = ["unic <yuniqueunic@gmail.com>"]
description = "CLI wrapper for schemaui, rendering JSON Schemas as TUIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YuniqueUnic/schemaui"
keywords = ["tui", "schema", "configuration", "terminal", "cross-platform"]
categories = ["command-line-interface", "config"]
readme = "cli_usage.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/schemaui-cli-v{ version }/schemaui-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(not(target_os = "windows"))']
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[[bin]]
name = "schemaui"
path = "src/main.rs"

[dependencies]
schemaui = { path = "..", version = "0.11.1", default-features = false }
serde_json = "1"
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
clap_complete = { version = "4", optional = true }
ureq = { version = "3", default-features = false, features = [
    "rustls",
], optional = true }
url = "2"

[features]
default = ["full", "completion", "remote-schema"]

full = ["json", "yaml", "toml", "tui", "web"]
completion = ["dep:clap_complete"]
remote-schema = ["dep:ureq"]

tui = ["schemaui/tui"]
web = ["schemaui/web"]
json = ["schemaui/json"]
yaml = ["schemaui/yaml"]
toml = ["schemaui/toml"]

web-types = ["schemaui/web-types"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
